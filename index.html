<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp sinh nhật vintage</title>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9c9a3;--bg2:#cdb98c;--blue:#4a7fd0;--blue2:#9cc0ee;--cream:#f7f0dc;--pink:#d6455d;--maroon:#6b2a3c;--ink:#3b4f8f;--panel:#fff8e8;--ptext:#3a2a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3b3326;--bg2:#2e281d;--panel:#2f2a22;--ptext:#f3e8d0}}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 30%,var(--bg),var(--bg2));font-family:'Patrick Hand','Segoe UI',sans-serif;overflow-x:hidden;color:var(--ptext)}
*{box-sizing:border-box}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 14px 90px}
h1{font-family:Lobster,cursive;font-weight:400;color:var(--maroon);margin:0 0 6px;font-size:clamp(22px,5vw,34px);text-align:center}
@media (prefers-color-scheme:dark){h1{color:#f0c9a0}}
.hint{opacity:.8;margin:0 0 18px;font-size:17px;text-align:center}
.stage{perspective:1600px;width:min(92vw,560px);transition:margin-top 1s ease;margin-top:0}
.stage.open{margin-top:min(70vw,470px)}
.card{container-type:inline-size;position:relative;width:100%;aspect-ratio:1/.85;transform-style:preserve-3d}
.letter{position:absolute;inset:0;background:var(--cream);border:2.4cqw solid var(--pink);border-radius:1.5cqw;padding:3.5cqw 4.5cqw;overflow:auto;box-shadow:0 10px 30px #0004;
background-image:repeating-linear-gradient(45deg,#fff4 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,#c9b4e922 0 1px,transparent 1px 5px)}
.letter::before{content:"✦ ♥ ✿ ✦ ♥ ✿ ✦ ♥ ✿ ✦ ♥ ✿ ✦ ♥ ✿ ✦";display:block;text-align:center;color:#b69be0;font-size:3cqw;letter-spacing:1cqw;white-space:nowrap;overflow:hidden}
.letter h2{font-family:Lobster,cursive;font-weight:400;color:var(--pink);text-align:center;margin:1cqw 0 2cqw;font-size:6.4cqw;line-height:1.15;letter-spacing:.2cqw}
.letter p{margin:0 0 1.6cqw;font-size:4.3cqw;line-height:1.4;color:var(--ink)}
.letter .fill{border-bottom:.3cqw dashed #a99be0;color:var(--pink);font-weight:700;padding:0 1cqw}
.letter .wish{white-space:pre-wrap;margin-bottom:4cqw}
.letter .sign{text-align:right;font-family:Lobster,cursive;color:var(--pink);font-size:5cqw}
.cover{position:absolute;inset:0;transform-origin:top center;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.5,0,.2,1);cursor:pointer;z-index:5}
.stage.open .cover{transform:rotateX(178deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.5cqw;overflow:hidden;box-shadow:0 10px 30px #0005}
.front{background:var(--cream);border:2.4cqw solid var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.front::before,.front::after{content:"✦ ♥ ✿ ✦ ♥ ✿ ✦ ♥ ✿ ✦ ♥ ✿ ✦ ♥ ✿ ✦";position:absolute;left:0;right:0;text-align:center;color:#b69be0;font-size:3cqw;letter-spacing:1cqw;white-space:nowrap;overflow:hidden}
.front::before{top:3cqw}.front::after{bottom:3cqw}
.front::before,.front::after{display:none}.front{border:0;background:#fbf3d8;display:block}.front svg{width:100%;height:100%;display:block}
.front .mesh,.back{background-image:repeating-linear-gradient(45deg,#fff3 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,#fff3 0 1px,transparent 1px 5px)}
.front .mesh{position:absolute;inset:0}
.back{background-color:var(--cream);transform:rotateX(180deg);display:flex;align-items:flex-end;justify-content:center;color:var(--pink);font-family:Lobster,cursive;font-size:4cqw;padding-bottom:3cqw}
.tap{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:2cqw;background:var(--cream);color:var(--pink);font:3.6cqw 'Patrick Hand',sans-serif;padding:1.2cqw 3cqw;border-radius:99px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.mini{display:none;position:absolute;right:5cqw;top:0;width:30cqw;height:42cqw;background:#eaf2fb;border-radius:1.5cqw;box-shadow:0 6px 18px #0004;transform:translateY(0) rotate(0);transition:transform 1s .9s ease;z-index:6;padding:2cqw;pointer-events:none;
background-image:repeating-linear-gradient(90deg,#fff 0 3cqw,#dbe8f6 3cqw 6cqw)}
.stage.open .mini{transform:translateY(-38cqw) rotate(7deg)}
.mini .hb{font:italic 4.2cqw Lobster,cursive;color:#6fa0e0;text-align:center;line-height:1}
.mini svg{width:100%;margin-top:1cqw}
.flame{animation:fl .3s infinite alternate;transform-origin:50% 100%}
@keyframes fl{to{transform:scaleY(1.2) rotate(4deg)}}
.float{position:fixed;bottom:-30px;pointer-events:none;color:var(--pink);opacity:.7;animation:up linear forwards;z-index:1}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
canvas#cv{position:fixed;inset:0;pointer-events:none;z-index:50}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:60}
.btn{border:0;background:var(--pink);color:#fff;font:19px 'Patrick Hand',sans-serif;padding:9px 18px;border-radius:99px;cursor:pointer;box-shadow:0 4px 12px #0003}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">Một món quà nhỏ dành cho bạn</h1>
  <p class="hint" id="hint">Chạm vào thiệp để mở ✦</p>
  <div class="stage" id="stage">
    <div class="card">
      <div class="mini"><div class="hb">Happy Birthday</div>
        <svg viewBox="0 0 100 100"><g class="flame"><path d="M50 8c6 8 4 14 0 14s-6-6 0-14z" fill="#ffb02e"/></g><rect x="47" y="22" width="6" height="22" fill="#f48fb1"/><rect x="18" y="44" width="64" height="30" rx="6" fill="#fff0a8"/><path d="M16 46q8 10 17 0t17 0 17 0 17 0v6H16z" fill="#f48fb1"/><rect x="12" y="74" width="76" height="14" rx="7" fill="#8fd3e8"/></svg></div>
      <div class="letter">
        <h2>GIẤY CHỨNG NHẬN<br>ĐỔI MỚI TUỔI TÁC</h2>

            </defs>

            <!-- DÂY TRANG TRÍ CỜ VÕNG MÉP TRÊN -->
            <path d="M 10,20 Q 200,50 390,20" stroke="#e57390" stroke-dasharray="4 4" stroke-width="3" fill="none"/>
            <g stroke="none">

            </g>

            <!-- CHỮ BIRTHDAY -->
            <text x='58' y='84' font-family='Patrick Hand,cursive' font-size='46' font-weight='700' letter-spacing='3' stroke='none' transform='rotate(-4 180 75)'><tspan fill='#e53935'>B</tspan><tspan fill='#f57c00'>I</tspan><tspan fill='#3aa83a'>R</tspan><tspan fill='#00a89d'>T</tspan><tspan fill='#1e5bd6'>H</tspan><tspan fill='#8e7cc3'>D</tspan><tspan fill='#d81b60'>A</tspan><tspan fill='#f4c300'>Y</tspan></text>
            
            <!-- CON THỎ GÓC TRÊN BÊN PHẢI -->
            <g stroke='#1e5bd6' stroke-width='3' fill='none'>
              <path d='M292 72c-8-22-4-34 4-32 8 2 10 18 10 30'/>

              <ellipse cx='310' cy='90' rx='28' ry='20' fill='#fff'/>
              <circle cx='301' cy='88' r='2' fill='#1e5bd6'/>
              <circle cx='319' cy='88' r='2' fill='#1e5bd6'/>
              <path d='M306 95q4 3 8 0'/>
            </g>

            <!-- BÔNG HOA ĐỜI SANG PHẢI CON THỎ -->
            <use href="#fl" transform="translate(368, 98) scale(1.05)" style="color:#f48fb1"/>

            <!-- ĐÁM MÂY PHÍA TRÊN BAO THƯ -->
            <g transform='translate(50, 105)'>
              <path d='M0 14q-8-2-6-9t10-6q4-8 12-3 9-1 9 7 0 11-9 11z' fill='#fff' stroke='#1e5bd6' stroke-width='2.5'/>
            </g>

            <!-- BAO THƯ -->
            <g transform="translate(45, 145)">
              <rect x='0' y='0' width='60' height='40' rx='3' fill='#fffaf0' stroke='#8ac4d6' stroke-width='3'/>
              <path d='M0 2l30 20 30-20' fill='none' stroke='#8ac4d6' stroke-width='3'/>
              <path d='M30 31c-7-4-8-11-3-11 2 0 3 1 3 2 0-1 1-2 3-2 5 0 4 7-3 11z' fill='#f06292'/>
            </g>

            <!-- NẾN VÀ BÁNH SINH NHẬT -->
            <g transform="translate(108, 172)">
              <g transform='rotate(-8)'>
                <rect x='0' y='14' width='15' height='36' rx='4' fill='#c9a7e8' stroke='#e53935' stroke-width='2.5'/>
                <path d='M0 26l15-5M0 36l15-5' stroke='#6a4fb0' stroke-width='2.5'/>
                <path d='M6 10c-6-7-1-14 0-16 1 2 7 9 0 16z' fill='#f4c300' stroke='#e53935' stroke-width='2.5'/>
              </g>
              <g transform="translate(24, -4)">
                <rect x='0' y='14' width='15' height='38' rx='4' fill='#2b5fd9' stroke='#1e5bd6' stroke-width='2.5'/>
                <path d='M7 10c-6-7-1-14 0-16 1 2 7 9 0 16z' fill='#f4c300' stroke='#e53935' stroke-width='2.5'/>
              </g>
            </g>

            <!-- Bánh sinh nhật -->
            <g transform='translate(5 28)'>
              <path d='M205 76v-10M192 82l-9-6M218 82l9-6M186 92h-10M224 92h10' stroke='#f4c300' stroke-width='3'/>
              <path d='M205 96c-7-4-8-11-3-11 2 0 3 1 3 3 0-2 1-3 3-3 5 0 4 7-3 11z' fill='#e53935' transform='translate(0 -4)'/>
              <rect x='202' y='98' width='6' height='22' fill='#6bbf4e' stroke='#2e9e3e' stroke-width='2'/>
              <rect x='176' y='120' width='58' height='26' rx='10' fill='#fff' stroke='#d81b60' stroke-width='3'/>
              <circle cx='186' cy='118' r='4.5' fill='#e53935'/>
              <circle cx='198' cy='115' r='4.5' fill='#e53935'/>
              <circle cx='214' cy='115' r='4.5' fill='#e53935'/>
              <circle cx='226' cy='118' r='4.5' fill='#e53935'/>
              <rect x='162' y='144' width='86' height='34' rx='15' fill='#f8c4b4' stroke='#e53935' stroke-width='3'/>
              <rect x='148' y='172' width='112' height='38' rx='18' fill='#f06292' stroke='#e53935' stroke-width='3'/>
              <path d='M154 184q8 8 16 0t16 0 16 0 16 0 16 0 16 0' fill='none' stroke='#e53935' stroke-width='3'/>
            </g>

            <!-- HÌNH TRÁI TIM DƯỚI BÁNH KEM -->
            <g transform="translate(190, 252) scale(0.95)">
              <path d='M15 32C-6 18 -4 0 7 0C12 0 15 4 15 8C15 4 18 0 23 0C34 0 36 18 15 32Z' fill='none' stroke='#f06292' stroke-width='3'/>
            </g>

            <!-- CHẬU HOA CHỈ CÓ 1 BÔNG HOA CHÍNH -->
            <g transform="translate(25, 235)">
              <path d="M 38 20 L 38 45" stroke="#2e9e3e" stroke-width="3" fill="none"/>
              <ellipse cx="28" cy="32" rx="6" ry="3" fill="#2e9e3e" transform="rotate(-30 28 32)"/>
              <ellipse cx="48" cy="32" rx="6" ry="3" fill="#2e9e3e" transform="rotate(30 48 32)"/>
              <use href="#fl" transform="translate(38, 14) scale(1.3)" style="color:#d81b60"/>
              <path d="M 22 45 L 54 45 L 50 64 L 26 64 Z" fill="#fff" stroke="#d6455d" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M 19 45 L 57 45" stroke="#d6455d" stroke-width="3" stroke-linecap="round"/>
              <circle cx="38" cy="54" r="3" fill="#d6455d"/>
            </g>

            <!-- CẦU CỒNG PHÍA BÊN PHẢI -->
            <g transform="translate(285, 195)">
              <path d='M10 40A38 38 0 0 1 86 40' fill='none' stroke='#e53935' stroke-width='3.5'/>
              <path d='M16 40A32 32 0 0 1 80 40' fill='none' stroke='#f4c300' stroke-width='3.5'/>
              <path d='M22 40A26 26 0 0 1 74 40' fill='none' stroke='#3aa83a' stroke-width='3.5'/>
              <path d='M28 40A20 20 0 0 1 68 40' fill='none' stroke='#1e5bd6' stroke-width='3.5'/>
              <use href='#cl' x='2' y='32' fill='#fff' stroke='#1e5bd6' stroke-width='2.5'/>
              <use href='#cl' x='68' y='32' fill='#fff' stroke='#1e5bd6' stroke-width='2.5'/>
            </g>

            <!-- BÔNG HOA PHÍA TRÊN CẦU CỒNG -->
            <use href="#fl" transform="translate(333, 170) scale(1.1)" style="color:#8e7cc3"/>

            <!-- NƠ / HỘP QUÀ GÓC DƯỚI PHẢI -->
            <g transform='translate(60 -10)'>
              <path d='M236 322q-14-2-10-16t16-8q4-14 22-10 16-6 26 8 14 0 14 14t-14 12z' fill='#fff' stroke='#7ec8e3' stroke-width='2.5'/>
              <path d='M262 296l18-4-8 16z' fill='#e53935' stroke='#e53935' stroke-width='2.5'/>
              <circle cx='252' cy='312' r='2' fill='#7ec8e3'/>
              <circle cx='278' cy='314' r='2' fill='#7ec8e3'/>

            <!-- TIẾT KIM TUYẾN TRANG TRÍ NHỎ -->
            <path d='M120 120q4-6 9 0t9 0' stroke='#5bc0be' stroke-width='3' fill='none'/>
            <path d='M276 138q5-6 8 0t8-2' stroke='#00a89d' stroke-width='3' fill='none'/>
            <path d='M340 140q6 4 12-2' stroke='#f06292' stroke-width='3' fill='none'/>

          <div class="tap">chạm để mở ♥</div>

</div>
<canvas id="cv"></canvas>
<div class="bar">
  <button class="btn" id="mus">♪ Nhạc: Tắt</button>
</div>
<script>
const DEF={c1:'CHÚT MỪN',c2:'SIN NHỰT',d:'10',m:'11',y:'2026',n:'Bảo Anhhhhh',a:'19',w:'Ye tuổi mới xinh gái hơn nhé, học giỏi hơn, lấy đc thật nhìu tiền hobo của neu nhíe nhíe. Sắp tới thi cử thuận lợi rùi làm 1 chuyến girls trip ha',s:'— hahamymy —'};
const K=Object.keys(DEF);let S={...DEF};

const $=id=>document.getElementById(id);
function render(){
  K.forEach(k=>{const t=$(k);if(t)t.textContent=S[k]});
}
render();

const stage=$('stage');let opened=false;
function toggle(){opened=!opened;stage.classList.toggle('open',opened);$('hint').textContent=opened?'Chúc bạn một tuổi mới thật rực rỡ ✦':'Chạm vào thiệp để mở ✦';
  if(opened){confetti();if(!playing)music(true)}}
$('cover').onclick=toggle;

// floating hearts/stars
setInterval(()=>{const e=document.createElement('div');e.className='float';e.textContent=['✦','♥','✿','★'][Math.random()*4|0];
  e.style.left=Math.random()*100+'vw';e.style.fontSize=12+Math.random()*20+'px';e.style.animationDuration=6+Math.random()*6+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),12500)},900);

// confetti
const cv=$('cv'),cx=cv.getContext('2d');let P=[],raf;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function confetti(){const col=['#d6455d','#4a7fd0','#f4c95d','#7bc47f','#b69be0','#f48fb1'];
  for(let i=0;i<160;i++)P.push({x:innerWidth/2,y:innerHeight*.5,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*6+3,c:col[i%6],a:Math.random()*6,va:(Math.random()-.5)*.4});
  cancelAnimationFrame(raf);loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
  P=P.filter(p=>p.y<cv.height+20);if(P.length)raf=requestAnimationFrame(loop)}

// music
let AC,playing=false,timer;
const N={G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
const M=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
function tone(f,t,d){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.5);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.6)}
function seq(){if(!playing)return;let t=AC.currentTime+.1;const b=.5;
  M.forEach(([n,d])=>{tone(N[n],t,d*b);tone(N[n]*2,t,d*b*.5);t+=d*b});
  timer=setTimeout(seq,(t-AC.currentTime+1.5)*1000)}
function music(on){playing=on;if(on){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();seq()}catch(e){playing=false}}else clearTimeout(timer);
  $('mus').textContent='♪ Nhạc: '+(playing?'Bật':'Tắt')}
$('mus').onclick=()=>music(!playing);
</script>
</body>
</html>
